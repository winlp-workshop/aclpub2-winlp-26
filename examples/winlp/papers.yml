  title: Improved Personalized Typing Predictions via Long Left Context
- abstract: 'Semantic IDs (SIDs) compress item embeddings into discrete code sequences
    used as the item vocabulary in generative retrieval. If the encoder is multilingual,
    it is tempting to assume the resulting SIDs are language-agnostic. We test this
    assumption on Amazon ESCI dataset \citep{reddy2022esci} rendered in English, Spanish,
    and Japanese. It fails at two separate points. Multilingual E5 places translations
    of the same product measurably apart, and residual quantization converts that
    displacement into a discrete prefix failure: under an English-heavy fit, a Japanese
    translation recovers the first SID code of its English counterpart in only 7.7\%
    of cases, against 89.0\% for an English rewording. A product-directed control
    shows the quantizer does not selectively increase language directions, instead
    the damage originates in the encoder. Most surprisingly, fitting the quantizer
    on a balanced language mixture makes cross-lingual agreement worse, not better,
    even as it equalizes codebook use. An English only fit preserves the first code
    for 67.6\% of Spanish translations, the balanced fit preserves it for 6.6\%. The
    results show that multilingual exposure alone does not buy consistent SIDs across
    languages. Cross-lingual SID agreement has to be optimized directly, or retrieval
    must tolerate code variation.'
