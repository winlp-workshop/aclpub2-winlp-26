- abstract: The increasing complexity of state-of-the-art neural networks creates
    significant computational energy overhead in Natural Language Processing (NLP)
    applications. A few studies have explored opportunities to reduce overhead by
    using a Spiking Neural Network (SNN) instead of a mainstream artificial neural
    network (ANN) in computer vision and sensory domains. A comprehensive analysis
    of SNN's usability for NLP tasks in low-resource languages has yet to be conducted.
    Hence, in this paper, we present the first-ever comparative energy-overhead analysis
    of ANNs vs. SNNs for text classification tasks in low-resource Indian languages
    such as Hindi, Bengali, and Telugu. Our experiments show that although we lose
    classification accuracy by an acceptable margin when replacing an ANN with an
    SNN, we save significant energy, which highlights the potential for efficient
    utilization of edge computing devices to run NLP tasks for low-resource languages.
    This work shows a direction for advancing energy-efficient NLP applications, especially
    for low-resource languages. We make code and dataset publicly available \footnote{\url{
    https://github.com/PS1076/Energy-Accuracy-Frontier}}.
