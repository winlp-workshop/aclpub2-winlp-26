- abstract: Rumour detection in Bangla remains severely under-resourced, with prior
    work conflating it with fake news classification and lacking domain-stratified
    analysis of the linguistic properties that distinguish misinformation from authentic
    content. We introduce MisInfo-11K, a domain-stratified corpus of 11,198 instances
    spanning seven topical domains, constructed from Bangla fact-checking portals
    and verified news outlets. Using 14 linguistically motivated markers, we show
    via chi-square and Kruskal-Wallis analysis that 13 of 14 exhibit significant cross-domain
    variation, revealing distinct deception strategies (e.g., authority mimicry in
    political rumours, fear amplification in health rumours). Building on this, we
    introduce the Marker Signal Void (MSV), a chi-square-weighted scoring framework
    identifying rumour instances with no net discriminative surface signal, establishing
    Macro-F1 = 0.9843 as the ceiling achievable by this 14-marker set. Benchmarking
    three pretrained transformers (BanglaBERT, MuRIL, XLM-RoBERTa) against five traditional
    models, MuRIL achieves the strongest performance (Macro-F1 0.9800), while a marker-augmented
    Random Forest reaches 0.9750, surpassing XLM-RoBERTa. The gap between the MSV
    ceiling and transformer performance quantifies the contribution of contextual
    semantic representations beyond surface-level linguistic cues.
