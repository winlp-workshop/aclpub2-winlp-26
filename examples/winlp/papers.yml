- abstract: 'The scarcity of high-quality, phonetically diverse datasets for low-resource
    languages like Amharic remains a significant barrier to high-fidelity speech synthesis.
    We present AmhTTS, the first open, natively evaluated Amharic text-to-speech system,
    developed by fine-tuning SpeechT5 on a curated 25-hour, single-speaker Amharic
    corpus paired with a HiFi-GAN vocoder. Unlike Meta MMS, the only other publicly
    available Amharic TTS system, which requires Latin script transliteration and
    reports no Amharic-specific evaluation, AmhTTS operates natively on Ethiopic script
    and is the first system to report human MOS scores on Amharic speech synthesis.
    To address the orthographic complexities of the Ethiopic script, we implement
    a three-stage text normalisation pipeline covering homophone unification, Ge''ez
    numeral expansion, and Amharic punctuation handling. System quality is assessed
    through a rigorous human evaluation via a purpose-built web platform, involving
    28 native Amharic-speaking voluntary evaluators who rated 35 linguistically motivated
    samples across four domains: phonetic coverage (ejectives and labialized consonants),
    gemination and prosody, numeral and date reading, and conversational fluency.
    Results yield an overall naturalness MOS of 3.71 and intelligibility MOS of 4.02
    on a 5-point scale, demonstrating that the rich pre-trained representations of
    SpeechT5 transfer effectively to a low-resource language with only 25 hours of
    data a fraction of the 460 hours used in the original English fine-tuning. While
    the system achieves high phonetic accuracy (MOS: 4.22/4.36), numeral synthesis
    and gemination modeling remain areas for future improvement. Given the demonstrated
    community demand for accessibility tools, we publicly release our fine-tuned model
    weights, the AmhTTS corpus, and evaluation data to advance low-resource TTS research.
    Our web application is currently active, serving users at multiple university
    disability centers in Ethiopia.'
