- abstract: 'Language models are now tested across many languages, but Kurdish is
    mostly missing from these efforts. We present KuMMLU, a multiple-choice benchmark
    for Central Kurdish (Sorani) built from the national examinations of the Kurdistan
    Region of Iraq. It contains 3,272 questions across 18 subjects: 2,256 native examination
    questions, with answers taken from the official keys published by the Ministry
    of Education, and 1,016 questions from six subjects translated from English MMLU.
    We evaluate 32 language models, including proprietary systems, open-weight models,
    and multilingual models built for wide language coverage. The best models reach
    about 88% accuracy, while the five multilingual baselines score between 15.8%
    and 37.2%, at most modestly above the 25% chance level and well below the strongest
    general-purpose systems; this includes the one model whose published language
    list contains Kurdish. Every model scores higher on the translated subset than
    on the native questions. We examine this gap in light of subject difficulty and
    possible overlap with training data, and release the benchmark to support Kurdish
    language technology.'
